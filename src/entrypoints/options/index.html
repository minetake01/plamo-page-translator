<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLaMo Page Translator — 設定</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main>
    <h1>PLaMo Page Translator</h1>
    <p class="muted">ローカルの PLaMo、または OpenAI 互換の翻訳サーバを使います。</p>

    <section>
      <h2>翻訳エンジン</h2>
      <label>プロトコル
        <select id="protocol">
          <option value="plamo">PLaMo（PFML3 / completions）</option>
          <option value="openai-chat">OpenAI 互換（chat/completions）</option>
        </select>
      </label>
      <label>Endpoint
        <input id="endpoint" type="url" placeholder="http://127.0.0.1:45871/v1" />
      </label>
      <label>Model
        <input id="model" type="text" placeholder="plamo-3-translate" />
      </label>
      <label id="key-field">API Key（OpenAI 互換のみ）
        <input id="apiKey" type="password" autocomplete="off" />
      </label>
      <label>Timeout (ms)
        <input id="timeoutMs" type="number" min="1000" step="1000" />
      </label>
      <label>並列数
        <input id="concurrency" type="number" min="1" max="4" />
      </label>
      <label class="check"><input id="addSpecialTokens" type="checkbox" /> add_special_tokens（PLaMo/vLLM）</label>
      <div class="row">
        <button id="probe" type="button">接続テスト</button>
        <span id="probe-result" class="muted"></span>
      </div>
    </section>

    <section>
      <h2>翻訳</h2>
      <label>翻訳先
        <select id="targetLang"></select>
      </label>
      <label>日本語の文体
        <select id="form">
          <option value="polite">敬体（です・ます）</option>
          <option value="plain">常体（だ・である）</option>
        </select>
      </label>
      <label class="check"><input id="autoTranslate" type="checkbox" /> ページを開いたら自動翻訳</label>
      <label class="check"><input id="langChange" type="checkbox" /> 訳文に lang 属性を付ける</label>
      <label>短文を翻訳する最小文字数
        <input id="shortTextMin" type="number" min="1" max="20" />
      </label>
    </section>

    <section>
      <h2>Gemini Decisions（判定のみ）</h2>
      <p class="muted">言語判定と領域判定にだけ使います。生成 LLM は使いません。</p>
      <label class="check"><input id="geminiEnabled" type="checkbox" /> Gemini を有効にする</label>
      <label>API Key
        <input id="geminiApiKey" type="password" autocomplete="off" />
      </label>
      <label>Endpoint
        <input id="geminiEndpoint" type="url" />
      </label>
      <label class="check"><input id="geminiScreenshot" type="checkbox" /> 全体スクリーンショットを送る</label>
      <div class="row">
        <button id="gemini-test" type="button">判定テスト</button>
        <span id="gemini-result" class="muted"></span>
      </div>
    </section>

    <section>
      <h2>データ</h2>
      <div class="row">
        <button id="save" class="primary" type="button">保存</button>
        <button id="clear-cache" type="button">翻訳キャッシュを消す</button>
        <button id="clear-profiles" type="button">構造プロファイルを消す</button>
      </div>
      <p id="save-result" class="muted"></p>
    </section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
